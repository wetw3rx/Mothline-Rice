# Mothline Kitty configuration
# Main profile for normal terminal windows.

font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

include themes/mothline.conf

# Subtle transparency while retaining strong text contrast.
background_opacity 0.92
dynamic_background_opacity yes

# Normal terminal geometry. Fastfetch uses its own dedicated profile.
remember_window_size yes
initial_window_width 105c
initial_window_height 30c

hide_window_decorations yes
window_padding_width 14
placement_strategy center

# Cursor and scrollback
cursor_shape beam
cursor_blink_interval 0.6
cursor_stop_blinking_after 15.0
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# Tabs: compact red active marker with subdued inactive tabs.
tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {index}: {title} "
active_tab_font_style bold
inactive_tab_font_style normal

# Useful terminal behavior
enable_audio_bell no
visual_bell_duration 0.0
confirm_os_window_close 0
copy_on_select clipboard
strip_trailing_spaces smart
open_url_with default
url_style single
detect_urls yes
mouse_hide_wait 2.0

# Mothline shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
