# Dedicated Mothline Kitty profile for the Fastfetch popup.
# Launch with: kitty --class fastfetch-popup --config ~/.config/kitty/fastfetch.conf

font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

include themes/mothline.conf

# Keep this opaque enough for crisp moth artwork and aligned information.
background_opacity 0.94
dynamic_background_opacity yes

remember_window_size no

# Proven fit for the 30-column moth and 86-column information frame.
initial_window_width 124c
initial_window_height 34c

hide_window_decorations yes
window_padding_width 10
placement_strategy center
confirm_os_window_close 0
enable_audio_bell no
linux_display_server wayland
